# ${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf — live, sourced from the
# dotfiles checkout. Generated fragments: sensible.conf, plugins.conf (Nix) and
# theme.conf (Stylix).

# tmux-sensible first; the settings below override its defaults.
source-file -q -F "#{?XDG_CONFIG_HOME,#{XDG_CONFIG_HOME},#{HOME}/.config}/tmux/sensible.conf"

# Fallback palette for hosts without Stylix appearance. theme.conf overrides
# these values when the shared appearance module is enabled.
set -g @thm_bg "colour0"
set -g @thm_fg "colour7"
set -g @thm_muted "colour8"
set -g @thm_surface "colour0"
set -g @thm_surface_alt "colour8"
set -g @thm_accent "colour2"
set -g @thm_accent_alt "colour4"
set -g @thm_alert "colour1"
set -g @thm_warn "colour3"
source-file -q -F "#{?XDG_CONFIG_HOME,#{XDG_CONFIG_HOME},#{HOME}/.config}/tmux/theme.conf"

# --- Prefix ---
set -g prefix C-b
bind C-b send-prefix

# --- Terminal / colors ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-kitty:Tc,xterm-ghostty:Tc"
set -g focus-events on
set -s escape-time 0
set -g history-limit 100000

# --- Indexing ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# --- Mouse + clipboard (tmux-yank handles y/Y and platform clipboard) ---
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on

# --- Copy mode (vi) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# --- Panes / windows (vim-style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z

# --- Reload ---
bind r source-file -F '#{?XDG_CONFIG_HOME,#{XDG_CONFIG_HOME},#{HOME}/.config}/tmux/tmux.conf' \; display-message "tmux.conf reloaded"

# --- Plugin settings (must be set before plugins.conf runs) ---
set -g @resurrect-strategy-nvim "session"
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"
set -g @continuum-save-interval "15"
set -g @sessionx-bind "o"
set -g @sessionx-zoxide-mode "on"
set -g @sessionx-filter-current "false"
set -g @sessionx-window-height "85%"
set -g @sessionx-window-width "80%"
set -g @sessionx-preview-ratio "55%"
set -g @floax-bind "f"
set -g @floax-width "90%"
set -g @floax-height "85%"
set -g @floax-title "scratch"
source-file -q -F "#{?XDG_CONFIG_HOME,#{XDG_CONFIG_HOME},#{HOME}/.config}/tmux/plugins.conf"

# --- Status bar (top, plain and padded) ---
set -g status-position top
set -g status-justify left
set -g status-left-length 32
set -g status-right-length 64
set -g status-interval 5
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g status-left "#[fg=#{@thm_accent},bold] #S  #[default]"
set -g status-right "#[fg=#{@thm_muted}]#{?client_prefix,prefix  ,}#[fg=#{@thm_fg}]#{host_short}"
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#{@thm_muted}] #I #W "
setw -g window-status-current-format "#[bg=#{@thm_surface_alt},fg=#{@thm_accent},bold]  #I #W  #[default]"
setw -g window-status-current-style "bg=#{@thm_surface_alt},fg=#{@thm_accent}"
set -g message-style "bg=#{@thm_surface},fg=#{@thm_fg}"
set -g message-command-style "bg=#{@thm_surface},fg=#{@thm_fg}"
setw -g mode-style "bg=#{@thm_surface_alt},fg=#{@thm_accent}"
set -g pane-border-style "fg=#{@thm_muted}"
set -g pane-active-border-style "fg=#{@thm_accent}"
set -g pane-border-lines double
set -g pane-border-indicators colour
set -g display-panes-colour "#{@thm_muted}"
set -g display-panes-active-colour "#{@thm_accent}"
setw -g clock-mode-colour "#{@thm_accent}"
setw -g clock-mode-style 24
