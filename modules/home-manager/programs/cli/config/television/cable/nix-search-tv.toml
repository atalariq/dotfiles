[metadata]
name = "nix-search-tv"
description = "Search nix options and packages"

[source]
command = "nix-search-tv print"

[preview]
command = "nix-search-tv preview '{}'"

[keybindings]
ctrl-r = "actions:run"
ctrl-i = "actions:shell"
ctrl-s = "actions:source"
ctrl-o = "actions:homepage"

[actions.run]
description = "Run the package"
command = "nix run {replace:s/\\/ /#/g}"
mode = "execute"

[actions.shell]
description = "Enter a new nix shell with this package"
command = "nix shell {replace:s/\\/ /#/g}"
mode = "execute"

[actions.source]
description = "Open the link to the source code"
command = "nix-search-tv source '{}' | xargs xdg-open"
mode = "execute"

[actions.homepage]
description = "Open the link to the homepage"
command = "nix-search-tv homepage '{}' | xargs xdg-open"
mode = "execute"
