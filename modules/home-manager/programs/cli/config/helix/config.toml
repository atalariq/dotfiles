# Helix trial configuration. Live-linked from the dotfiles checkout, so
# `:config-reload` (or `pkill -USR1 hx`) picks up edits without a rebuild.
# Mirrors the nvf minimal profile: modal editing settings only, no language
# servers or formatters are put on PATH here.

# Generated by Stylix (theme module); config.toml stays editable.
theme = "stylix"

[editor]
line-number = "relative"
cursorline = true
mouse = true
bufferline = "multiple"
scrolloff = 8
rulers = [80, 100]
color-modes = true
true-color = true
clipboard-provider = "wayland"
idle-timeout = 50
completion-trigger-len = 2
preview-completion-insert = false
auto-format = false
text-width = 80

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false
git-ignore = true

[editor.search]
smart-case = true

[editor.whitespace]
render = "all"

[editor.whitespace.characters]
tab = "»"
space = "·"
nbsp = "␣"
newline = "⏎"

[editor.indent-guides]
render = true

[editor.gutters]
layout = ["diagnostics", "spacer", "line-numbers"]

[editor.gutters.line-numbers]
min-width = 3

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.statusline]
left = ["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
center = []
right = ["diagnostics", "selections", "position", "file-encoding", "file-type"]

# Keep the nvf leader habits where Helix has an equivalent action. Helix 25.07
# has no file-tree view, so `space e` opens the picker in the working directory.
[keys.normal.space]
e = "file_picker_in_current_directory"
w = ":write"
q = ":quit"

[keys.insert]
C-s = ":write"
