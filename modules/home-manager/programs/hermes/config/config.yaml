model:
  provider: custom
  base_url: http://127.0.0.1:20128/v1
  default: coding-free
fallback_providers: []
toolsets:
  - hermes-cli
agent:
  max_turns: 30
  api_max_retries: 2
  verify_on_stop: true
  output_limit: 8192
terminal:
  backend: local
  cwd: .
  timeout: 180
  auto_source_bashrc: false
  shell_init_files: []
  env_passthrough: []
compression:
  enabled: true
  threshold: 0.7
  target_ratio: 0.3
auxiliary:
  compression:
    provider: custom
    model: coding-free
    base_url: http://127.0.0.1:20128/v1
    api_key: ${OPENAI_API_KEY}
  title_generation:
    enabled: false
delegation:
  provider: custom
  model: coding-free
  base_url: http://127.0.0.1:20128/v1
  api_key: ${OPENAI_API_KEY}
  orchestrator_enabled: false
  max_concurrent_children: 1
  max_spawn_depth: 1
  subagent_auto_approve: false
curator:
  enabled: false
display:
  compact: true
  language: id
  show_cost: true
  show_reasoning: false
timezone: Asia/Jakarta
