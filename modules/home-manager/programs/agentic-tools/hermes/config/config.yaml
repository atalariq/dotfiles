model:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  default: deepseek-flash
  api_key: ${DEEPSEEK_API_KEY}
  reasoning_echo: true
fallback_providers: []
toolsets:
  - terminal
  - file
  - web
  - todo
  - delegation
  - clarify
agent:
  max_turns: 30
  api_max_retries: 2
  verify_on_stop: true
  run_budget_seconds: 1800
  disabled_toolsets:
    - browser
    - computer_use
    - connections
    - memory
    - session_search
    - skills
    - code_execution
    - cronjob
terminal:
  # Host execution is deliberate: br and Nix use their native host packages.
  # Local mode has user access; manual approvals are not filesystem isolation.
  backend: local
  cwd: .
  timeout: 180
  auto_source_bashrc: false
  shell_init_files: []
  env_passthrough: []
compression:
  enabled: true
  threshold: 0.7
  target_ratio: 0.3
auxiliary:
  # Pin enabled side tasks to the same direct provider.
  # Never enter a paid OpenRouter auxiliary fallback automatically.
  free_only: true
  transient_retries: 1
  compression: &direct
    fallback_chain: []
    provider: deepseek
    model: deepseek-flash
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
  vision: *direct
  skills_hub: *direct
  mcp: *direct
  memory_query_rewrite: *direct
  tts_audio_tags: *direct
  voice_chat: *direct
  triage_specifier: *direct
  kanban_decomposer: *direct
  profile_describer: *direct
  goal_judge: *direct
  curator: *direct
  monitor: *direct
  moa_reference: *direct
  moa_aggregator: *direct
  background_review:
    <<: *direct
    enabled: false
  title_generation:
    enabled: false
    model_upgrade_enabled: false
  approval:
    fallback_chain: []
    provider: deepseek
    model: deepseek-flash
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
  review:
    fallback_chain: []
    provider: deepseek
    model: deepseek-flash
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
delegation:
  provider: deepseek
  model: deepseek-flash
  base_url: https://api.deepseek.com/v1
  api_key: ${DEEPSEEK_API_KEY}
  orchestrator_enabled: false
  max_concurrent_children: 2
  max_spawn_depth: 1
  subagent_auto_approve: false
  fallback_providers: []
approvals:
  # Routine commands already run without prompts. Protected host/publishing
  # commands are native hard-denies: the coordinator returns reviewed commands
  # for the owner to execute. This pin has no approvals.ask setting.
  mode: manual
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  deny:
    - '*sudo *'
    - '*doas *'
    - '*pkexec *'
    - '*git add *'
    - '*git commit *'
    - '*git push*'
    - '*gh pr create*'
    - '*gh release*'
    - '*git reset --hard*'
    - '*git clean *'
    - '*rm -rf *'
    - '*sops decrypt*'
    - '*sops -d*'
    - '*nixos-rebuild *'
    - '*home-manager switch*'
    - '*darwin-rebuild *'
    - '*just apply-*'
    - '*nix run *home-manager*switch*'
    - '*/bin/switch-to-configuration *'
security:
  allow_lazy_installs: false
cron:
  catch_up_missed: false
  allow_agent_scheduling: false
curator:
  enabled: false
display:
  compact: true
  language: id
  show_cost: true
  show_reasoning: false
timezone: Asia/Jakarta
