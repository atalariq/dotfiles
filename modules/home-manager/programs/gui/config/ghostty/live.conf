# Live Ghostty settings. Included by the generated ~/.config/ghostty/config.
# Reload with ctrl+shift+comma after editing.

theme = stylix
font-family = Fira Code
font-size = 12
font-feature = calt
font-feature = liga
font-feature = ss01
font-feature = ss02
font-feature = ss03
font-feature = ss05
font-feature = ss08

window-padding-x = 8
window-padding-y = 8
window-decoration = false
background-opacity = 0.96
cursor-style = block
cursor-style-blink = false
mouse-hide-while-typing = true
copy-on-select = clipboard
confirm-close-surface = false
scrollback-limit = 10000
shell-integration = fish
shell-integration-features = no-cursor

keybind = ctrl+shift+enter=new_split:down
keybind = ctrl+shift+backslash=new_split:right
keybind = ctrl+shift+t=new_tab
keybind = ctrl+shift+w=close_surface
keybind = ctrl+shift+left=goto_split:left
keybind = ctrl+shift+right=goto_split:right
keybind = ctrl+shift+up=goto_split:up
keybind = ctrl+shift+down=goto_split:down
keybind = ctrl+shift+comma=reload_config
