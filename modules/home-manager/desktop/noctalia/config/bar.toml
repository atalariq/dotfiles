# Noctalia bar layout. Array order controls the actual widget order.
# Theme/font and desktop ownership are generated separately.

[bar]
order = ["main"]

[bar.main]
font_family = "Fira Code"
margin_ends = 0
radius = 0
widget_spacing = 12
start = ["workspaces", "umbriel-companion", "media", "now-playing"]
end = ["tray", "shelf", "battery", "network", "control-center", "clock", "notifications"]

[bar.main.dead_zone.actions]
left = "none"

[widget.clock]
format = "%a %d %b %R"

[widget.control-center]
glyph = "toggle-right-filled"

[widget.media]
album_art_only = true
art_size = 18
hide_when_no_media = true
max_length = 120
rotate_album_art = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.tray]
drawer_columns = 1
match_adjacent_spacing = true
scale = 0.9

[widget.shelf]
type = "alok-debnath/shelf:shelf"

[widget.umbriel-companion]
type = "noctalia/umbriel-companion:bar"

[widget.now-playing]
enable_scroll = false
hide_album_art = true
hide_artist = true
hide_when_no_media = true
max_length = 800
show_lyric_line = true
type = "tranzem/media-lyrics:now-playing"
