[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 1800.0

[idle.behavior.lock-and-suspend]
action = "suspend"
enabled = true
lock_before_suspend = false
timeout = 3600.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 1830.0
