# Noctalia native entrypoint. Use only this explicit include order instead of
# alphabetically loading every TOML file from the config root.
# Writable settings.toml remains application-owned and overlays these defaults.
[include]
autoload = false
files = ["bar.toml", "control_center.toml", "hooks.toml", "idle.toml", "lockscreen.toml", "osd.toml", "plugins.toml", "shell.toml"]

[desktop_widgets]
enabled = false

[nightlight]
enabled = true
