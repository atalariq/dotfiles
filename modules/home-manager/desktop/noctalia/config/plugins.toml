[plugins]
enabled = ["alok-debnath/shelf", "noctalia/bitwarden", "noctalia/translator", "noctalia/umbriel-companion", "tranzem/media-lyrics"]

auto_update = "none"

[plugin_settings."alok-debnath/shelf"]
close_after_drag = true
remove_after_drag = true
shortcut = ""
# Nix-provided interpreter with GTK4/PyGObject. Keeps Noctalia's service
# environment free of GTK4 LD_PRELOAD and LD_LIBRARY_PATH.
python = "~/.local/bin/shelf-python"
