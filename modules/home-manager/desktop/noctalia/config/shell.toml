# Noctalia shell. Native settings; the shell watches included files.
# Theme/font and desktop ownership are generated separately.

[shell]
external_ip_enabled = true
font_family = "Inter"
# No launch wrapper is needed: plugin-specific GTK4 runtime lives in
# shelf-python, so the service and every launched app inherit a clean
# environment. Do not add launch_apps_custom_command here.
screen_time_enabled = true
settings_show_advanced = false
launch_apps_as_systemd_services = true

[shell.panel]
clipboard_placement = "attached"
clipboard_position = "auto"
launcher_placement = "attached"
open_near_click_control_center = true
open_near_click_session = true
polkit_placement = "attached"
polkit_position = "auto"

[shell.launcher]
app_grid = true
categories = false
category_icons_only = true
default_view = "all"

[shell.screenshot]
annotate = true
confirm_region = true
region_modifier = "shift"
remember_last_region = true
show_cursor = true
skip_annotate_on_copy_save = true
directory = "/home/atalariq/Pictures/Screenshots"
