# Noctalia shell. Native settings; the shell watches included files.
# Theme/font and desktop ownership are generated separately.

[shell]
external_ip_enabled = true
font_family = "Inter"
# Noctalia's direct spawn path intermittently fails for Electron/IDE apps.
# Issue 2519's workaround launches them in a transient scope instead.
launch_apps_custom_command = "systemd-run --user --scope --collect -- $CMD"
screen_time_enabled = true
settings_show_advanced = false

[shell.panel]
clipboard_placement = "attached"
clipboard_position = "auto"
launcher_placement = "attached"
open_near_click_control_center = true
open_near_click_session = true
polkit_placement = "attached"
polkit_position = "auto"

[shell.launcher]
app_grid = true
categories = false
category_icons_only = true
default_view = "all"

[shell.screenshot]
annotate = true
confirm_region = true
region_modifier = "shift"
remember_last_region = true
show_cursor = true
skip_annotate_on_copy_save = true
directory = "/home/atalariq/Pictures/Screenshots"
