# Mango binds. Native settings; edit here and use SUPER+SHIFT+R to reload.
# Host monitors, theme colors, and conditional integrations are generated separately.
# This fragment owns the key-mode sequence: common, then default. The resize
# block stays last in binds/resize.conf so the host binding appends under default.

bind = SUPER,minus,toggle_scratchpad
bind = SUPER,grave,toggle_named_scratchpad,scratchpad,none,kitty --app-id=scratchpad

# common key mode.
key_mode = common
bind = SUPER+SHIFT,R,reload_config

# default key mode. Every fragment below adds default-mode binds only.
key_mode = default
