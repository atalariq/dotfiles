# Hyper layer: Ctrl+Super+Alt, mirroring the macOS Vorssaint system keys.
# Screen capture follows Cmd+Shift+3/4/5, with Shift kept optional.
# Plain modifiers stay as the fast path; this layer is the muscle-memory path.
bind = CTRL+SUPER+ALT,3,spawn,noctalia msg screenshot-fullscreen
bind = CTRL+SUPER+ALT+SHIFT,3,spawn,noctalia msg screenshot-fullscreen
bind = CTRL+SUPER+ALT,4,spawn,noctalia msg screenshot-region
bind = CTRL+SUPER+ALT+SHIFT,4,spawn,noctalia msg screenshot-region
bind = CTRL+SUPER+ALT,5,spawn,noctalia msg screenshot-window
bind = CTRL+SUPER+ALT+SHIFT,5,spawn,noctalia msg screenshot-window
bind = CTRL+SUPER+ALT,A,spawn,noctalia msg screenshot-annotate
bind = CTRL+SUPER+ALT,R,spawn,obs-cmd recording toggle
bind = CTRL+SUPER+ALT,C,spawn,noctalia msg panel-toggle clipboard
bind = CTRL+SUPER+ALT,E,spawn,kitty -e espanso edit
bind = CTRL+SUPER+ALT,Space,spawn,noctalia msg panel-toggle launcher
bind = CTRL+SUPER+ALT,Q,killclient
