# Screenshots and recording. Default key mode.
bind = NONE,Print,spawn,noctalia msg screenshot-region
bind = SHIFT,Print,spawn,noctalia msg screenshot-fullscreen
bind = ALT,Print,spawn,noctalia msg screenshot-window
bind = CTRL,Print,spawn,noctalia msg screenshot-annotate
bind = SUPER+ALT,R,spawn,obs-cmd recording toggle

# Enter resize mode last; the host binding is appended after this fragment.
bind = SUPER,R,setkeymode,resize
