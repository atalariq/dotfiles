# Screenshots and recording. Default key mode.
bindn = NONE,Print,spawn,noctalia msg screenshot-region
bindn = SHIFT,Print,spawn,noctalia msg screenshot-fullscreen
bindn = ALT,Print,spawn,noctalia msg screenshot-window
bindn = CTRL,Print,spawn,noctalia msg screenshot-annotate
bindn = SUPER+ALT,R,spawn,obs-cmd recording toggle

# Enter resize mode last; the host binding is appended after this fragment.
bind = SUPER,R,setkeymode,resize
