# Mango native configuration. Include order is intentional.
# ./ paths resolve from this root config directory, including on reload.
source = ./native/input.conf
source = ./native/appearance.conf
source = ./native/layout.conf
source = ./native/tags.conf
source = ./native/rules.conf
source = ./native/gestures.conf
# Binds are per concern. common.conf selects the common and default key modes,
# so the default-mode fragments below are order-independent; resize.conf must
# stay last because it leaves the resize key mode active for the host binding.
source = ./native/binds/common.conf
source = ./native/binds/workspaces.conf
source = ./native/binds/windows.conf
source = ./native/binds/layout.conf
source = ./native/binds/apps.conf
source = ./native/binds/screenshots.conf
source = ./native/binds/resize.conf

# Host monitor/theme/integration values are applied by the generated wrapper.
