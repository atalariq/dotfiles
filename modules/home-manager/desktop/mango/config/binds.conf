# Keybindings retain the established workflow; resize is an explicit key mode.
# Split by purpose using the original Mango configuration as the layout reference.
axisbind = SUPER,Up,viewtoleft_have_client
axisbind = SUPER,Down,viewtoright_have_client
axisbind = ALT,UP,focusdir,up
