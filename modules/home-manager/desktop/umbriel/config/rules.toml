# Umbriel rules. Native configuration; included in the root file.
# Host output, theme, and conditional integrations are generated separately.

[[scratchpad]]
name = "terminal"
spawn_when_empty = "kitty --app-id=scratchpad"

[[window_rule]]
default_scratchpad = "terminal"

[window_rule.default_floating_size_px]
height = 720
width = 1080

[window_rule.match]
app_id = "^scratchpad$"

[[window_rule]]
default_floating = true

[window_rule.match]
app_id = "^(com[.]gabm[.]satty|termfilechooser|files|org[.]gnome[.]Nautilus|pavucontrol|org[.]pulseaudio[.]pavucontrol|blueman-manager|org[.]blueman[.]Manager|nm-connection-editor|pinentry.*|.*PolicyKit.*|dev[.]noctalia[.]Noctalia|dev[.]noctalia[.]UmbrielSharePicker)$"

[[window_rule]]
default_floating = true

[window_rule.match]
title = "^(Picture.in.picture|Open File.*|Open Folder|Save As|Save File|Choose wallpaper|Steam Guard)$"
