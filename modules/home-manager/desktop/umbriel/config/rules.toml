# Umbriel rules. Native configuration; included in the root file.
# Host output, theme, and conditional integrations are generated separately.

[[scratchpad]]
name = "terminal"
spawn_when_empty = "kitty --app-id=scratchpad"

[[window_rule]]
default_scratchpad = "terminal"

[window_rule.default_floating_size_px]
height = 720
width = 1080

[window_rule.match]
app_id = "^scratchpad$"

[[window_rule]]
default_floating = true

[window_rule.match]
app_id = "^(termfilechooser|files|org[.]gnome[.]Nautilus|pavucontrol|org[.]pulseaudio[.]pavucontrol|blueman-manager|org[.]blueman[.]Manager|nm-connection-editor|pinentry.*|.*PolicyKit.*|dev[.]noctalia[.]Noctalia|dev[.]noctalia[.]UmbrielSharePicker)$"

# PIP: floating, pinned above windows, bottom-right, never steals focus.
[[window_rule]]
default_floating = true
default_pinned = true
default_focused = false

[window_rule.default_position]
anchor = "bottom_right"
x = 20
y = 20

[window_rule.match]
title = "^Picture.in.picture$"

# Dialogs keep plain floating.
[[window_rule]]
default_floating = true

[window_rule.match]
title = "^(Open File.*|Open Folder|Save As|Save File|Choose wallpaper|Steam Guard)$"

# mpv opens floating (video-in-corner style).
[[window_rule]]
default_floating = true

[window_rule.match]
app_id = "^mpv$"

# Steam/Proton games: keep the mouse inside the window.
[[window_rule]]
confine_pointer = true

[window_rule.match]
app_id = "^steam_app_.*$"

# Emulators: same confinement. app_ids below are best-guess patterns —
# see Validation/owner-test step; owner runs `umbriel windows` with each
# emulator open and corrects the regex if needed.
[[window_rule]]
confine_pointer = true

[window_rule.match]
app_id = "^(org[.]libretro[.]RetroArch|DuckStation|PPSSPP|melonDS|rpcs3)$"

# VMs: compositor shortcuts stay usable while the guest grabs the keyboard.
[[window_rule]]
allow_shortcuts_inhibit = false

[window_rule.match]
app_id = "^virt-manager$"

# OBS keeps drawing while hidden (recording must not stall).
[[window_rule]]
background_render = true

[window_rule.match]
app_id = "^obs$"
