# Hyper layer: Ctrl+Mod+Alt, mirroring the macOS Vorssaint system keys.
# Screen capture follows Cmd+Shift+3/4/5, with Shift kept optional.
# Shelf stays in the module-generated binding because it depends on the
# desktop.shelf option; everything else lives here.

[keybinds]

# Screen capture.
"Ctrl+Mod+Alt+3" = { action = "spawn:noctalia msg screenshot-fullscreen", repeat = false }
"Ctrl+Mod+Alt+Shift+3" = { action = "spawn:noctalia msg screenshot-fullscreen", repeat = false }
"Ctrl+Mod+Alt+4" = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Ctrl+Mod+Alt+Shift+4" = { action = "spawn:noctalia msg screenshot-region", repeat = false }
"Ctrl+Mod+Alt+5" = { action = "spawn:noctalia msg screenshot-window", repeat = false }
"Ctrl+Mod+Alt+Shift+5" = { action = "spawn:noctalia msg screenshot-window", repeat = false }
"Ctrl+Mod+Alt+A" = { action = "spawn:noctalia msg screenshot-annotate", repeat = false }

# System actions.
"Ctrl+Mod+Alt+R" = { action = "spawn:obs-cmd recording toggle", repeat = false }
"Ctrl+Mod+Alt+C" = { action = "spawn:noctalia msg panel-toggle clipboard", repeat = false }
"Ctrl+Mod+Alt+E" = { action = "spawn:kitty -e espanso edit", repeat = false }
"Ctrl+Mod+Alt+Space" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Ctrl+Mod+Alt+Q" = { action = "window-close", repeat = false }
