# Umbriel native configuration. Later includes override earlier scalar values;
# the including file itself wins last. Rule lists preserve their source order.
# Keybinds are split per concern; their [keybinds] tables merge per key.
[include]
files = [
  "general.toml",
  "input.toml",
  "layout.toml",
  "appearance.toml",
  "keybinds.toml",
  "rules.toml",
]
