# Window focus and movement, column movement, layout and scratchpad controls.

[keybinds]
# Launching, closing, and desktop panels. Package/session-selected bindings are
# added by the generated host wrapper.

"Mod+Return" = { action = "spawn kitty", repeat = false }
"Mod+Shift+Return" = { action = "spawn kitty", repeat = false }
"Mod+W" = { action = "spawn brave-origin", repeat = false }
"Mod+Shift+Q" = { action = "window-close", repeat = false }
# "Mod+Shift+Alt+Q" = { action = "session-quit", repeat = false }

"Mod+Space" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+V" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Mod+E" = { action = "spawn noctalia msg panel-toggle launcher /emo", repeat = false }
"Mod+C" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
# "Mod+N" = { action = "spawn noctalia msg panel-toggle notifications", repeat = false }
"Mod+Y" = { action = "spawn noctalia msg panel-toggle wallpaper", repeat = false }
"Mod+Shift+Comma" = { action = "spawn noctalia msg settings-toggle", repeat = false }
"Mod+Escape" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+L" = "column-move-right"

"Mod+Shift+Space" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+X" = "window-cycle-primary-extent"
"Mod+Shift+X" = "window-cycle-primary-extent-back"
"Mod+Minus" = { action = "scratchpad-toggle terminal", repeat = false }
"Mod+Grave" = { action = "scratchpad-toggle terminal", repeat = false }
"Mod+Shift+Minus" = { action = "window-move-to-scratchpad terminal", repeat = false }

# ── Resize / move / tiling ─────────────────────────────────────────────────
# Umbriel now uses space-separated action arguments (`action arg ...`). The
# old `action:arg`/slash form was removed upstream. Direct extent nudges repeat
# while held (default repeat is on).
"Mod+Ctrl+H" = "window-modify-primary-extent -0.05"
"Mod+Ctrl+L" = "window-modify-primary-extent 0.05"
"Mod+Ctrl+J" = "window-modify-secondary-extent -0.05"
"Mod+Ctrl+K" = "window-modify-secondary-extent 0.05"

# Pin above everything / last-focused toggle.
# "Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+Tab" = { action = "window-focus-last", repeat = false }

# Column consume/expel (Umbriel example-config keys).
"Mod+Comma" = { action = "window-consume-or-expel-left", repeat = false }
"Mod+Period" = { action = "window-consume-or-expel-right", repeat = false }

# Discoverability and multi-output. (Mod+/ is a bad chord in 0.1.0 — Slash.)
"Mod+Slash" = { action = "cheatsheet-toggle", repeat = false }
"Mod+Alt+Left" = { action = "output-focus-left", repeat = false }
"Mod+Alt+Right" = { action = "output-focus-right", repeat = false }
"Mod+Alt+Up" = { action = "output-focus-up", repeat = false }
"Mod+Alt+Down" = { action = "output-focus-down", repeat = false }
"Mod+Shift+Alt+Left" = { action = "window-move-to-output-left", repeat = false }
"Mod+Shift+Alt+Right" = { action = "window-move-to-output-right", repeat = false }
"Mod+Shift+Alt+Up" = { action = "window-move-to-output-up", repeat = false }
"Mod+Shift+Alt+Down" = { action = "window-move-to-output-down", repeat = false }

# Hard-kill (SIGKILL) — deliberately awkward to reach.
# "Mod+Shift+Alt+Q" = { action = "window-kill", repeat = false }

# Escape hatch for games/remote-desktops that grab all shortcuts.
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }

# Submap: keyboard resize (fine/coarse), jump to move.
"Mod+R" = { action = "submap resize", repeat = false }
"submap[resize],H" = "window-modify-primary-extent -0.02"
"submap[resize],L" = "window-modify-primary-extent 0.02"
"submap[resize],J" = "window-modify-secondary-extent -0.02"
"submap[resize],K" = "window-modify-secondary-extent 0.02"
"submap[resize],Shift+H" = "window-modify-primary-extent -0.1"
"submap[resize],Shift+L" = "window-modify-primary-extent 0.1"
"submap[resize],Shift+J" = "window-modify-secondary-extent -0.1"
"submap[resize],Shift+K" = "window-modify-secondary-extent 0.1"
"submap[resize],G" = { action = "submap move", repeat = false }
"submap[resize],Escape" = "submap reset"
"submap[resize],Return" = "submap reset"

# Submap: floating move by pixels / to edges / center.
"submap[move],H" = "window-move-by -40 0"
"submap[move],L" = "window-move-by 40 0"
"submap[move],J" = "window-move-by 0 40"
"submap[move],K" = "window-move-by 0 -40"
"submap[move],Left" = "window-move-to left 20 0"
"submap[move],Right" = "window-move-to right 20 0"
"submap[move],Up" = "window-move-to top 0 20"
"submap[move],Down" = "window-move-to bottom 0 20"
"submap[move],C" = { action = "window-center", repeat = false }
"submap[move],Escape" = "submap reset"
"submap[move],Return" = "submap reset"

# Submap: anchored floating moves (halves/quarters) and centering.
"Mod+G" = { action = "submap region", repeat = false }
"submap[region],H" = { action = "window-move-to left 20 0", repeat = false }
"submap[region],L" = { action = "window-move-to right 20 0", repeat = false }
"submap[region],K" = { action = "window-move-to top 0 20", repeat = false }
"submap[region],J" = { action = "window-move-to bottom 0 20", repeat = false }
"submap[region],1" = { action = "window-move-to top_left 20 20", repeat = false }
"submap[region],2" = { action = "window-move-to top_right 20 20", repeat = false }
"submap[region],3" = { action = "window-move-to bottom_left 20 20", repeat = false }
"submap[region],4" = { action = "window-move-to bottom_right 20 20", repeat = false }
"submap[region],C" = { action = "window-center", repeat = false }
"submap[region],X" = { action = "window-toggle-floating", repeat = false }
"submap[region],F" = { action = "window-toggle-floating", repeat = false }
"submap[region],Escape" = "submap reset"
"submap[region],Return" = "submap reset"

"Mod+1" = "workspace-switch 1"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+2" = "workspace-switch 2"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+3" = "workspace-switch 3"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+4" = "workspace-switch 4"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+5" = "workspace-switch 5"
"Mod+Shift+5" = "window-move-to-workspace 5"

# Workspace selection and moving windows between workspaces.
# Previous/next workspace.
"Mod+P" = "workspace-previous"
"Mod+Shift+P" = "window-move-to-workspace-previous"
"Mod+N" = "workspace-next"
"Mod+Shift+N" = "window-move-to-workspace-next"

# Screenshots and recording, plus media/volume and brightness keys. Noctalia owns
# capture; OBS toggles through its local obs-websocket endpoint.

"Print" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Shift+Print" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Alt+Print" = { action = "spawn noctalia msg screenshot-window", repeat = false }
"Ctrl+Print" = { action = "spawn noctalia msg screenshot-annotate", repeat = false }
"Mod+Alt+R" = { action = "spawn obs-cmd recording toggle", repeat = false }

# Media, volume, display and keyboard brightness.
"XF86AudioRaiseVolume" = "spawn noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn noctalia msg volume-down"
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", repeat = false }
"XF86AudioPlay" = { action = "spawn noctalia msg media toggle", repeat = false }
"XF86AudioNext" = { action = "spawn noctalia msg media next", repeat = false }
"XF86AudioPrev" = { action = "spawn noctalia msg media prev", repeat = false }
"XF86MonBrightnessUp" = "spawn noctalia msg brightness-up"
"XF86MonBrightnessDown" = "spawn noctalia msg brightness-down"
"XF86KbdBrightnessUp" = "spawn brightnessctl --device=*kbd_backlight set 1+"
"XF86KbdBrightnessDown" = "spawn brightnessctl --device=*kbd_backlight set 1-"

# Hyper layer: Ctrl+Mod+Alt, mirroring the macOS Vorssaint system keys.
# Screen capture follows Cmd+Shift+3/4/5, with Shift kept optional.
# The shelf toggle lives here because the Noctalia shelf plugin now owns it;
# everything else also lives here.

# Screen capture.
"Ctrl+Mod+Alt+3" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Ctrl+Mod+Alt+Shift+3" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = false }
"Ctrl+Mod+Alt+4" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Ctrl+Mod+Alt+Shift+4" = { action = "spawn noctalia msg screenshot-region", repeat = false }
"Ctrl+Mod+Alt+5" = { action = "spawn noctalia msg screenshot-window", repeat = false }
"Ctrl+Mod+Alt+Shift+5" = { action = "spawn noctalia msg screenshot-window", repeat = false }
"Ctrl+Mod+Alt+A" = { action = "spawn noctalia msg screenshot-annotate", repeat = false }

# System actions.
"Ctrl+Mod+Alt+R" = { action = "spawn obs-cmd recording toggle", repeat = false }
"Ctrl+Mod+Alt+C" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
# "Ctrl+Mod+Alt+E" = { action = "spawn kitty -e espanso edit", repeat = false }
"Ctrl+Mod+Alt+Space" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Ctrl+Mod+Alt+Q" = { action = "window-close", repeat = false }

# Noctalia Plugins - Shelf
"Ctrl+Mod+Alt+D" = { action = "spawn noctalia msg plugin alok-debnath/shelf:service all toggle", repeat = false }
