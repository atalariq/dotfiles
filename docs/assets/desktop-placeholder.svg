<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Desktop screenshot placeholder</title>
  <desc id="desc">A placeholder for a future screenshot of the Umbriel, Mango fallback and Noctalia desktop, not a capture of the running system.</desc>
  <rect width="1600" height="900" fill="#191724"/>
  <rect x="44" y="44" width="1512" height="812" rx="24" fill="#211f30" stroke="#4b465e" stroke-width="2"/>
  <path d="M80 114H1520" stroke="#4b465e"/>
  <circle cx="88" cy="82" r="7" fill="#eb6f92"/>
  <circle cx="114" cy="82" r="7" fill="#f6c177"/>
  <circle cx="140" cy="82" r="7" fill="#9ccfd8"/>
  <text x="800" y="350" text-anchor="middle" fill="#e0def4" font-family="sans-serif" font-size="72" font-weight="600">A place to think.</text>
  <text x="800" y="425" text-anchor="middle" fill="#c4a7e7" font-family="monospace" font-size="25">NixOS · Umbriel · Noctalia · Gruvbox</text>
  <rect x="550" y="505" width="500" height="58" rx="29" fill="#2b273d"/>
  <text x="800" y="542" text-anchor="middle" fill="#f6c177" font-family="monospace" font-size="22">SCREENSHOT PLACEHOLDER</text>
  <text x="800" y="655" text-anchor="middle" fill="#aaa5bd" font-family="sans-serif" font-size="22">Replace this image after desktop acceptance.</text>
  <text x="800" y="785" text-anchor="middle" fill="#aaa5bd" font-family="monospace" font-size="18">Explicit choices. Reproducible tools. Reasons next to the code.</text>
</svg>
