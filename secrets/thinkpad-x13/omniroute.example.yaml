# API keys are stored here as the source of truth, then enrolled manually in the UI.
# A new DB may enable storage encryption. Back up/migrate an existing DB first.
environment: |
  JWT_SECRET=REPLACE_WITH_UNIQUE_RANDOM_SECRET
  API_KEY_SECRET=REPLACE_WITH_UNIQUE_RANDOM_SECRET
  INITIAL_PASSWORD=REPLACE_WITH_UNIQUE_ADMIN_PASSWORD
  STORAGE_ENCRYPTION_KEY=REPLACE_WITH_64_HEX_CHARACTERS
openrouter_api_key: REPLACE_LOCALLY
deepseek_api_key: REPLACE_LOCALLY
