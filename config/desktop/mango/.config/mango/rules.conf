# ============================================
# Layer rule
# ============================================
# Rofi launcher
layer_rule=animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi

# Notification daemons - no animation, no shadow = snappy feel
layer_rule=no_animation:1,no_shadow:1,layer_name:fyi
layer_rule=no_animation:1,no_shadow:1,layer_name:swaync
layer_rule=no_animation:1,no_shadow:1,layer_name:dunst
layer_rule=no_animation:1,no_shadow:1,layer_name:mako

# Selection overlays - instant, no blur (slurp, color pickers)
layer_rule=no_blur:1,no_animation:1,layer_name:selection

# ============================================
# Window Rule
# ============================================

# Screenshot & Annotation Tools
window_rule=no_animation:1,is_floating:1,is_overlay:1,no_animation:1,app_id:slurp
window_rule=allow_csd:1,no_animation:1,is_floating:1,is_overlay:1,no_animation:1,app_id:com.gabm.satty

# XDG portals (file chooser, screen share, etc.)
window_rule=is_floating:1,is_overlay:1,app_id:xdg-desktop-portal
window_rule=is_floating:1,is_overlay:1,app_id:xdg-desktop-portal-gtk
window_rule=is_floating:1,is_overlay:1,app_id:xdg-desktop-portal-gnome
window_rule=is_floating:1,is_overlay:1,is_global:1,width:1080,height:720,app_id:termfilechooser
window_rule=is_floating:1,is_overlay:1,is_global:1,width:1080,height:720,title:termfilechooser
window_rule=is_floating:1,is_overlay:1,is_global:1,width:1080,height:720,app_id:termfilechooser,title:termfilechooser

# Drag & Drop
window_rule=is_floating:1,is_overlay:1,is_global:1,is_open_silent:1,width:300,height:200,offset_x:98,offset_y:-98,app_id:it.catboy.ripdrag
window_rule=is_floating:1,is_overlay:1,is_global:1,is_open_silent:1,width:300,height:200,offset_x:98,offset_y:-98,app_id:dragon-drop

# GPG / SSH pinentry
window_rule=is_floating:1,is_overlay:1,app_id:Pinentry-gtk
window_rule=is_floating:1,is_overlay:1,app_id:pinentry
window_rule=is_floating:1,is_overlay:1,app_id:pinentry-qt

# Polkit authentication agents
window_rule=is_floating:1,is_overlay:1,app_id:polkit-gnome-authentication-agent-1
window_rule=is_floating:1,is_overlay:1,app_id:org.gnome.PolicyKit1.AuthenticationAgent

# Generic file/save dialogs (by title)
window_rule=is_floating:1,is_overlay:1,title:Open File
window_rule=is_floating:1,is_overlay:1,title:Open Files
window_rule=is_floating:1,is_overlay:1,title:Select a File
window_rule=is_floating:1,is_overlay:1,title:Choose wallpaper
window_rule=is_floating:1,is_overlay:1,title:Open Folder
window_rule=is_floating:1,is_overlay:1,title:Save As
window_rule=is_floating:1,is_overlay:1,title:Save File
window_rule=is_floating:1,is_overlay:1,title:Library
window_rule=is_floating:1,is_overlay:1,title:Print

# # Terminal Swallowing
# windowrule=isterm:1,appid:foot
# windowrule=isterm:1,appid:kitty
# windowrule=isterm:1,appid:alacritty
# windowrule=isterm:1,appid:wezterm
# windowrule=isterm:1,appid:rio
# windowrule=isterm:1,appid:ghostty

# Apps that should never swallow a terminal
window_rule=no_swallow:1,app_id:org.gnome.Nautilus
window_rule=no_swallow:1,app_id:thunar
window_rule=no_swallow:1,app_id:nemo
window_rule=no_swallow:1,app_id:files

# Firefox - allow CSD (it handles its own titlebar)
window_rule=allow_csd:1,app_id:firefox
window_rule=allow_csd:1,app_id:firefox-esr
window_rule=allow_csd:1,app_id:librewolf
window_rule=allow_csd:1,app_id:zen-browser

# Chromium-based
window_rule=allow_csd:1,app_id:chromium
window_rule=allow_csd:1,app_id:google-chrome
window_rule=allow_csd:1,app_id:helium-browser
window_rule=allow_csd:1,app_id:brave-browser
window_rule=allow_csd:1,app_id:microsoft-edge

# PiP - always floating, global, overlay, bottom-right corner
window_rule=is_floating:1,is_overlay:1,is_global:1,is_open_silent:1,width:540,height:360,offset_x:98,offset_y:-98,title:Picture in picture

# MPV - floating by default, sensible size
window_rule=is_floating:1,width:1280,height:720,app_id:mpv

# VLC
window_rule=is_floating:1,app_id:vlc

# GUI File manager
window_rule=is_floating:1,app_id:org.gnome.Nautilus
window_rule=is_floating:1,app_id:thunar
window_rule=is_floating:1,app_id:nemo
window_rule=is_floating:1,app_id:org.kde.dolphin
window_rule=is_floating:1,app_id:pcmanfm
window_rule=is_floating:1,app_id:files

# Zoom - floating, maximized
window_rule=is_floating:1,force_fake_maximize:1,app_id:zoom

# JetBrains IDEs
# Note: force_fakemaximize conflicts with isfloating on most tiling WMs.
# If you want IDEA tiled and maximized, drop isfloating.
# If you want it floating, use explicit width/height instead.
window_rule=force_fake_maximize:1,app_id:jetbrains-idea
window_rule=force_fake_maximize:1,app_id:jetbrains-pycharm

# JetBrains floating dialogs (settings, find, etc.) - matched by title
window_rule=is_floating:1,is_overlay:1,title:win0,app_id:jetbrains-idea
window_rule=is_floating:1,is_overlay:1,title:win0,app_id:jetbrains-pycharm

# VSCode / VSCodium
window_rule=force_fake_maximize:1,app_id:code
window_rule=force_fake_maximize:1,app_id:codium

# Note-taking & Research
window_rule=force_fake_maximize:1,app_id:obsidian
window_rule=force_fake_maximize:1,app_id:zotero
window_rule=force_fake_maximize:1,app_id:anki
window_rule=force_fake_maximize:1,app_id:logseq

# Productivity & Office
window_rule=force_fake_maximize:1,app_id:libreoffice-writer
window_rule=force_fake_maximize:1,app_id:libreoffice-calc
window_rule=force_fake_maximize:1,app_id:libreoffice-impress
window_rule=force_fake_maximize:1,app_id:libreoffice-draw

# LibreOffice floating dialogs (font picker, styles, etc.)
window_rule=is_floating:1,is_overlay:1,app_id:libreoffice,title:Navigator
window_rule=is_floating:1,is_overlay:1,app_id:libreoffice,title:Styles

# GUI image viewer
window_rule=is_floating:1,app_id:imv
window_rule=is_floating:1,app_id:swayimg

# GIMP - let it tile, it manages its own multi-window layout
window_rule=allow_csd:1,force_fake_maximize:1,app_id:gimp

# Inkscape
window_rule=force_fake_maximize:1,app_id:org.inkscape.Inkscape

# Pavucontrol (audio mixer) - small floating window
window_rule=is_floating:1,width:800,height:600,app_id:pavucontrol
window_rule=is_floating:1,width:800,height:600,app_id:org.pulseaudio.pavucontrol

# Bluetooth managers
window_rule=is_floating:1,width:600,height:500,app_id:blueman-manager
window_rule=is_floating:1,width:600,height:500,app_id:org.blueman.Manager

# Network managers
window_rule=is_floating:1,app_id:nm-connection-editor

# Disk usage
window_rule=is_floating:1,app_id:org.gnome.baobab
window_rule=is_floating:1,app_id:qdirstat

# System monitors
window_rule=is_floating:1,force_fake_maximize:1,app_id:org.gnome.SystemMonitor
window_rule=is_floating:1,force_fake_maximize:1,app_id:io.missioncenter.MissionCenter

# Calculator
window_rule=is_floating:1,app_id:org.gnome.Calculator
window_rule=is_floating:1,app_id:qalculate-gtk

# Archive managers
window_rule=is_floating:1,app_id:org.gnome.FileRoller
window_rule=is_floating:1,app_id:ark

# Gaming - Steam
# Steam main window - let it tile
window_rule=force_fake_maximize:1,app_id:steam

# Steam floating dialogs (login, settings, update)
# windowrule=isfloating:1,isoverlay:1,appid:steam,title:Steam
window_rule=is_floating:1,is_overlay:1,app_id:steam,title:Steam Guard
window_rule=is_floating:1,is_overlay:1,app_id:steam,title:Steam - Self Updater
window_rule=is_floating:1,is_overlay:1,app_id:steam,title:Friends List

# Steam overlay inside games - don't mess with it
window_rule=no_blur:1,no_animation:1,app_id:steam_app_.*

# Native games / Proton - tearing for smooth gameplay
window_rule=force_tearing:1,no_animation:1,no_border:1,no_shadow:1,no_radius:1,title:steam_app_.*

# Gaming - Lutris
window_rule=is_floating:1,force_fake_maximize:1,app_id:lutris
window_rule=is_floating:1,is_overlay:1,app_id:lutris,title:Lutris
window_rule=is_floating:1,is_overlay:1,title:Wine System Tray

# osu! needs tearing disabled and low latency decorations
window_rule=is_floating:1,no_animation:1,no_border:1,no_shadow:1,no_radius:1,allow_shortcuts_inhibit:1,app_id:osu

# General emulator rules: no decorations, no animations, tearing on
window_rule=is_floating:1,no_animation:1,no_border:1,no_shadow:1,no_radius:1,force_tearing:1,app_id:Ryujinx
window_rule=is_floating:1,no_animation:1,no_border:1,no_shadow:1,no_radius:1,force_tearing:1,app_id:yuzu
window_rule=is_floating:1,no_animation:1,no_border:1,no_shadow:1,no_radius:1,force_tearing:1,app_id:suyu
window_rule=is_floating:1,no_animation:1,no_border:1,no_shadow:1,no_radius:1,force_tearing:1,app_id:rpcs3
window_rule=is_floating:1,no_animation:1,no_border:1,no_shadow:1,no_radius:1,force_tearing:1,app_id:PPSSPP
window_rule=is_floating:1,no_animation:1,no_border:1,no_shadow:1,no_radius:1,force_tearing:1,app_id:dolphin-emu
window_rule=is_floating:1,no_animation:1,no_border:1,no_shadow:1,no_radius:1,force_tearing:1,app_id:pcsx2
window_rule=is_floating:1,no_animation:1,no_border:1,no_shadow:1,no_radius:1,force_tearing:1,app_id:retroarch

# Screen Mirroring
window_rule=force_fake_maximize:1,app_id:at.yrlf.wl_mirror

# Showmethekey
window_rule=is_floating:1,app_id:one.alynx.showmethekey
window_rule=is_floating:1,is_overlay:1,app_id:showmethekey-gtk

# Noctalia
window_rule=is_floating:1,is_overlay:1,force_fake_maximize:1,app_id:dev.noctalia.Noctalia,title:Noctalia Settings
