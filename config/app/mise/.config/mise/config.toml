[settings]
# Keep fuzzy selectors in config.toml, but resolve them deterministically.
lockfile = true

# Don't immediately adopt freshly released versions.
# Default mise is 24h.
minimum_release_age = "3d"


[tools]
# Runtime
bun = "latest"
go = "1.27"
node = "24.21.0"
rust = "stable"
uv = "0.12.19"

# CLI Tools
atuin = "18.23.0"
bat = "0.26.1"
delta = "0.19.2"
eza = "0.23.5"
fd = "10.5.0"
fzf = "0.74.4"
lazygit = "0.65.1"
neovim = "0.12.5"
ripgrep = "15.2.0"
starship = "1.26.0"
tealdeer = "1.9.0"
typst = "0.15.1"
usage = "6.11.1"
yazi = "26.9.1"
zoxide = "0.10.0"

# Agentic Tools
agy = "latest"
claude-code = "latest"
codegraph = "1.6.0"
codex = "latest"
opencode = "latest"
rtk = "latest"


# Editor Tools
rumdl = "0.2.77"
shellcheck = "0.11.0"
stylua = "2.5.2"
tree-sitter = "0.27.0"
tinymist = "0.15.8"
typos = "1.50.2"
typstyle = "0.15.1"
yamlfmt = "0.21.0"
"npm:oxlint" = "latest"
"npm:prettier" = "latest"
imagemagick = "7.1.2_31"
difftastic = "0.71.0"
python = "3.14.7"
yamllint = "1.38.0"
