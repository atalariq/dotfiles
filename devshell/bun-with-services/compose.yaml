# Each profile is opt-in. These public multi-arch image digests were resolved
# from the upstream registry; update tags and digests together deliberately.
services:
  postgres:
    profiles: [postgres]
    image: docker.io/library/postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    profiles: [redis]
    image: docker.io/library/redis:8@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
    command: [redis-server, --appendonly, "yes"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  collector:
    profiles: [observability]
    image: docker.io/otel/opentelemetry-collector-contrib:0.155.0@sha256:4935caa35e9a4cb387e35732e8fb22b2b5759af8d12e7043357f03837f6e8df5
    command: [--config=/etc/otelcol/config.yaml]
    volumes: ["./observability/collector.yaml:/etc/otelcol/config.yaml:ro,Z"]
    ports: ["127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317", "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318", "127.0.0.1:${COLLECTOR_HEALTH_PORT:-13133}:13133"]
  prometheus:
    profiles: [observability]
    image: docker.io/prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus]
    volumes: ["./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro,Z", "prometheus-data:/prometheus"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 20
  grafana:
    profiles: [observability]
    image: docker.io/grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-development-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: ["./observability/grafana:/etc/grafana/provisioning:ro,Z", "grafana-data:/var/lib/grafana"]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
